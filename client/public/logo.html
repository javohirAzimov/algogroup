<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface); font-family: "Inter", sans-serif; }
  .row { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: center; }
  .mark {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; }
  .info { display: flex; flex-direction: column; gap: 10px; }
  .name { font-size: 22px; font-weight: 700; color: var(--fg); letter-spacing: -.01em; }
  .meta { font-size: 12px; color: var(--fg-muted); letter-spacing: .04em; text-transform: uppercase; font-weight: 500; }
  .swatch-row { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--fg-muted); }
  .dot { width: 18px; height: 18px; border-radius: 4px; background: #006000; border: 1px solid var(--border); }
  .desc { font-size: 13px; color: var(--fg-muted); line-height: 1.5; }
</style>
</head>
<body>
  <div class="row">
    <div class="mark">
      <img src="../assets/algo-group-logo.jpg" alt="ALGO Group logo" />
    </div>
    <div class="info">
      <span class="meta">ALGO Group · primary mark</span>
      <span class="name">ALGO Group</span>
      <div class="swatch-row"><span class="dot"></span> Brand green &middot; #006000</div>
      <p class="desc">Stylized A + G monogram in deep forest green. Use on white or very light backgrounds.</p>
    </div>
  </div>
</body>
</html>
